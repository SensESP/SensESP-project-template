; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

; Change the default environment to match your board. Valid options are:
; - arduino_esp32
; - arduino_esp32c3
; - pioarduino_esp32
; - pioarduino_esp32c3
; - shesp32
; - halmet
; - halser
; - esp32dev_espidf
; - esp32c3_espidf
; - shesp32_espidf
; - halmet_espidf
; - halser_espidf
;
; The <board>_espidf environments build ESP-IDF from source so that
; sdkconfig.defaults is authoritative. That is what enables the dynamic
; mbedTLS buffers (CONFIG_MBEDTLS_DYNAMIC_BUFFER) a TLS Signal K connection
; needs to fit in memory. Flash a <board>_espidf environment on any device
; that talks to a TLS Signal K server. The plain arduino environments use
; precompiled libraries that ignore sdkconfig.defaults; they build much faster
; and are fine for compile checks and plain HTTP servers, but against a TLS
; server the device runs out of memory in mbedtls_ssl_setup (-0x7F00) and
; Signal K stays Disconnected.

default_envs = esp32dev_espidf

[env]

; Options common for all working environments

;; Uncomment and change these if PlatformIO can't auto-detect the ports
;monitor_port = /dev/tty.usbserial-310
;upload_port = /dev/tty.usbserial-310
; Lower the upload speed to 115200 if you have problems with uploading
upload_speed = 2000000
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ ^3.5.0
    ; Add any additional dependencies here

build_flags =
    ; Max (and default) debugging level in Arduino ESP32 Core
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG

; This line defines the partition table to use. "min_spiffs" has two app
; partitions, one for OTA updates and one for the running app, but the
; SPIFFS filesystem is quite small. Every environment in this file builds for
; 4 MB of flash. The arduino environments find the table by name inside the
; Arduino framework package, but the <board>_espidf environments look in the
; project directory only, so min_spiffs.csv is kept here as a copy of the
; framework's file. For an 8 MB layout (for example "default_8MB.csv" on
; HALMET), sdkconfig.defaults must also declare the larger flash size; see
; https://github.com/hatlabs/HALMET-example-firmware for a working setup.

board_build.partitions = min_spiffs.csv

;; Uncomment the following lines to use Over-the-air (OTA) Updates
;upload_protocol = espota
;upload_port = IP_ADDRESS_OF_ESP_HERE
;upload_flags =
;  --auth=YOUR_OTA_PASSWORD

; You shouldn't need to touch the settings in this section below this line.

build_unflags =
    -Werror=reorder
monitor_filters = esp32_exception_decoder

test_build_src = true
check_tool = clangtidy
check_flags =
    clangtidy: --fix --format-style=file --config-file=.clang-tidy


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Platform configurations follow

[arduino]

; The official PlatformIO espressif32 platform. It is stuck on Arduino Core
; 2.x and cannot build the espidf environments or the SSL/TLS support, so it
; cannot connect to a TLS Signal K server. Kept for users who cannot use the
; pioarduino platform.

platform = espressif32 @ ^6.9.0
framework = arduino

lib_ignore =
    esp_websocket_client

build_flags =
    ${env.build_flags}
    ; Arduino Core bug workaround: define the log tag for the Arduino
    ; logging macros.
    -D TAG='"Arduino"'

[pioarduino]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino

; SensESP includes esp_websocket_client.h but declares no dependency on it,
; and the pioarduino Arduino framework package bundles no copy. The arduino
; environments take it from the ESP-IDF component registry archive below,
; pinned to 1.7.0, the first release that receives under the client lock.
; The registry's object_id download URL used here earlier silently pinned
; 1.3.0. The <board>_espidf environments restate lib_deps without this line
; and take the component from src/idf_component.yml instead.

lib_deps =
    ${env.lib_deps}
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip

build_flags =
    ${env.build_flags}
    ; Enable SSL/TLS support for Signal K server connections
    -D SENSESP_SSL_SUPPORT=1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Board configurations follow

[esp32]

board = esp32dev
build_flags =
    ${env.build_flags}
    -D BUTTON_BUILTIN=0
    -D LED_BUILTIN=2

[esp32c3]

board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D SENSESP_BUTTON_PIN=9
    -D PIN_RGB_LED=8
    ; Use the CDC USB port as Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Permutations of platform and device.

[env:arduino_esp32]

extends = arduino, esp32
build_flags =
    ${arduino.build_flags}
    ${esp32.build_flags}

[env:pioarduino_esp32]

extends = pioarduino, esp32
build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}

[env:arduino_esp32c3]

extends = arduino, esp32c3
build_flags =
    ${arduino.build_flags}
    ${esp32c3.build_flags}

[env:pioarduino_esp32c3]

extends = pioarduino, esp32c3
build_flags =
    ${pioarduino.build_flags}
    ${esp32c3.build_flags}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Individual board configurations

[env:shesp32]

extends = pioarduino, esp32
build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}

[env:halmet]

extends = pioarduino, esp32
build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}

[env:halser]

extends = pioarduino, esp32c3

build_flags =
    ${pioarduino.build_flags}
    ${esp32c3.build_flags}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; ESP-IDF from source (espidf + arduino dual framework) variants.
;
; Each <board>_espidf environment extends its arduino counterpart and adds
; the espidf framework, so sdkconfig.defaults (and sdkconfig.defaults.esp32c3
; on the C3, which ESP-IDF appends by target name) become authoritative. The
; esp_websocket_client component comes from src/idf_component.yml instead of
; the registry zip, so lib_deps is restated without it. esp_insights and
; esp_rainmaker are pulled in transitively by arduino-esp32 and require their
; server certificates embedded even though this project uses neither cloud
; service, hence board_build.embed_txtfiles.

[env:esp32dev_espidf]

extends = env:pioarduino_esp32
framework = espidf, arduino
lib_deps =
    ${env.lib_deps}
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:esp32c3_espidf]

extends = env:pioarduino_esp32c3
framework = espidf, arduino
lib_deps =
    ${env.lib_deps}
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:shesp32_espidf]

extends = env:shesp32
framework = espidf, arduino
lib_deps =
    ${env.lib_deps}
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:halmet_espidf]

extends = env:halmet
framework = espidf, arduino
lib_deps =
    ${env.lib_deps}
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:halser_espidf]

extends = env:halser
framework = espidf, arduino
lib_deps =
    ${env.lib_deps}
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
